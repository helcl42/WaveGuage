<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wave Gauge Live</title>
<style>
:root{--bg:#081a20;--fg:#e3f0f2;--muted:#8aa5ad;--line:#21404a;--panel:rgba(8,26,32,.82);--wave:#3cc3cf;--scale:#f0a24a;--ink:#04191d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#view{position:relative;flex:1;min-height:0;background:#000;touch-action:none}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#start h1{margin:0;font-size:1.6rem}
#start p{margin:0;color:var(--muted);max-width:30em}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--panel);padding:6px 12px;border-radius:999px;font-size:.85rem;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#live{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(48px + env(safe-area-inset-top,0px));background:var(--panel);padding:8px 12px;border-radius:12px;text-align:right}
#live .v{font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums}
#live .s{color:var(--wave);font-size:.8rem}
#bar{background:var(--bg);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:600 .95rem system-ui,sans-serif;border:1px solid var(--line);background:#0f262e;color:var(--fg);border-radius:10px;padding:10px 12px;cursor:pointer}
button.primary{background:var(--wave);color:var(--ink);border-color:var(--wave)}
button[aria-pressed=true]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stats b{font-size:1.1rem}
input{width:4.5em;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:#0f262e;color:var(--fg)}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <video id="vid" playsinline muted autoplay></video>
    <canvas id="cv"></canvas>
    <div id="start">
      <h1>Wave Gauge Live</h1>
      <p>Point at the break with a swimmer or surfer in view. Tap their feet and head once for scale, then tap each wave's trough and crest as it breaks.</p>
      <button class="primary" id="go">Start camera</button>
      <p id="err"></p>
    </div>
    <div id="hint" hidden></div>
    <div id="live" hidden><div class="v" id="lv">–</div><div class="s" id="ls"></div></div>
  </div>
  <div id="bar">
    <div class="row">
      <button id="mScale" aria-pressed="false">● Scale</button>
      <button id="mWave" aria-pressed="false">● Wave</button>
      <button id="freeze">Freeze</button>
      <button id="undo">Undo</button>
      <button id="unit">ft</button>
    </div>
    <div class="row"><label>Reference <input id="ref" type="number" step="0.05" value="1.75"> m</label>
      <span style="color:var(--muted);font-size:.8rem">Surfer lying on board ≈ 0.3 m</span></div>
    <div class="stats">
      <div><span>Waves</span><b id="n">0</b></div>
      <div><span>Average</span><b id="avg">–</b></div>
      <div><span>Biggest third</span><b id="max">–</b></div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id),vid=$('vid'),cv=$('cv'),cx=cv.getContext('2d');
let mode='scale',sc=[],wp=[],waves=[],metric=false,frozen=false,stream=null;
function fit(){const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;}
// map tap to video-content coordinates (normalised), honouring object-fit:contain
function box(){const W=cv.width,H=cv.height,vw=vid.videoWidth||W,vh=vid.videoHeight||H,k=Math.min(W/vw,H/vh);return{x:(W-vw*k)/2,y:(H-vh*k)/2,w:vw*k,h:vh*k,vw,vh};}
function toN(e){const r=cv.getBoundingClientRect(),b=box(),px=(e.clientX-r.left)*devicePixelRatio,py=(e.clientY-r.top)*devicePixelRatio;return{x:(px-b.x)/b.w,y:(py-b.y)/b.h};}
function toPx(p){const b=box();return[b.x+p.x*b.w,b.y+p.y*b.h];}
function len(p){const b=box();return Math.hypot((p[1].x-p[0].x)*b.vw,(p[1].y-p[0].y)*b.vh);}
const mpp=()=>sc.length===2?(+$('ref').value||1.75)/len(sc):null;
const fmt=m=>m==null?'–':metric?m.toFixed(2)+' m':(m*3.281).toFixed(1)+' ft';
function surf(m){if(m==null)return'';const f=m*3.281;return f<1.5?'ankle–knee':f<2.5?'knee–thigh':f<3.5?'waist high':f<4.5?'chest high':f<5.5?'shoulder high':f<7?'head high':'overhead';}
function hint(){const h=$('hint');h.hidden=false;
  h.textContent=mode==='scale'?(sc.length?'Tap the top of their head':'Tap a person’s feet / waterline'):
    (!mpp()?'Set scale first':wp.length?'Tap the crest':'Tap the trough of a breaking wave');}
function stats(){const k=mpp(),ms=waves.map(w=>k?len(w)*k:null).filter(v=>v!=null);
  $('n').textContent=waves.length;
  const avg=ms.length?ms.reduce((a,b)=>a+b)/ms.length:null,t=[...ms].sort((a,b)=>b-a),n=Math.max(1,Math.ceil(t.length/3)),big=ms.length?t.slice(0,n).reduce((a,b)=>a+b)/n:null;
  $('avg').textContent=fmt(avg);$('max').textContent=fmt(big);
  const last=ms.length?ms[ms.length-1]:null;$('live').hidden=last==null;$('lv').textContent=fmt(last);$('ls').textContent=surf(last);}
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  if(frozen){const b=box();cx.drawImage(vid,b.x,b.y,b.w,b.h);}
  const lw=3*devicePixelRatio,seg=(p,c)=>{cx.strokeStyle=cx.fillStyle=c;cx.lineWidth=lw;
    p.forEach(q=>{const[x,y]=toPx(q);cx.beginPath();cx.arc(x,y,lw*2,0,7);cx.fill();});
    if(p.length===2){const[a,b]=[toPx(p[0]),toPx(p[1])];cx.beginPath();cx.moveTo(...a);cx.lineTo(...b);cx.stroke();}};
  seg(sc,'#f0a24a');
  // live ruler: tick marks every 0.5 m from the scale feet point
  const k=mpp();if(k&&!frozen){const b=box(),[x0,y0]=toPx(sc[0]),step=0.5/k*(b.h/b.vh);
    cx.strokeStyle='rgba(240,162,74,.6)';cx.fillStyle='#f0a24a';cx.font=`${11*devicePixelRatio}px system-ui`;cx.lineWidth=1.5*devicePixelRatio;
    for(let i=1;i<=6;i++){const y=y0-i*step;if(y<0)break;cx.beginPath();cx.moveTo(x0-12*devicePixelRatio,y);cx.lineTo(x0+12*devicePixelRatio,y);cx.stroke();cx.fillText(fmt(i*.5),x0+16*devicePixelRatio,y+4*devicePixelRatio);}}
  waves.slice(-3).forEach(w=>seg(w,'rgba(60,195,207,.55)'));seg(wp,'#3cc3cf');
  requestAnimationFrame(draw);
}
function setMode(m){mode=m;$('mScale').setAttribute('aria-pressed',m==='scale');$('mWave').setAttribute('aria-pressed',m==='wave');hint();}
cv.addEventListener('pointerdown',e=>{if(!stream)return;const p=toN(e);
  if(mode==='scale'){if(sc.length===2)sc=[];sc.push(p);if(sc.length===2)setMode('wave');}
  else{wp.push(p);if(wp.length===2){waves.push(wp);wp=[];if(frozen)toggleFreeze();}}
  hint();stats();});
function toggleFreeze(){frozen=!frozen;frozen?vid.pause():vid.play();$('freeze').textContent=frozen?'Resume':'Freeze';}
$('freeze').onclick=toggleFreeze;
$('mScale').onclick=()=>{sc=[];setMode('scale');stats();};
$('mWave').onclick=()=>setMode('wave');
$('undo').onclick=()=>{if(wp.length)wp.pop();else if(waves.length)waves.pop();else sc.pop();hint();stats();};
$('unit').onclick=()=>{metric=!metric;$('unit').textContent=metric?'m':'ft';stats();};
$('ref').oninput=stats;
$('go').onclick=async()=>{
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false});
    vid.srcObject=stream;await vid.play();$('start').hidden=true;fit();setMode('scale');stats();draw();
    try{await navigator.wakeLock?.request('screen');}catch{}
  }catch(err){$('err').textContent='Camera unavailable: '+err.message+'. The page must be opened over https and camera access allowed.';}
};
addEventListener('resize',fit);
</script>
</body>
</html>
